name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://provence360:provence360@localhost:5432/provence360_dev
  DATABASE_URL_APP: postgresql://provence360_app:provence360_app@localhost:5432/provence360_dev
  DATABASE_URL_RESOLVER: postgresql://provence360_resolver:provence360_resolver@localhost:5432/provence360_dev
  DATABASE_URL_AUTH: postgresql://provence360_auth:provence360_auth@localhost:5432/provence360_dev
  ROOT_DOMAIN: provence360.app
  NODE_ENV: development

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provence360
          POSTGRES_PASSWORD: provence360
          POSTGRES_DB: provence360_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provence360 -d provence360_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the isolated test database
        run: |
          PGPASSWORD=provence360 psql -h localhost -U provence360 -d provence360_dev \
            -c "CREATE DATABASE provence360_test OWNER provence360;"

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests (real Postgres, RLS enforced)
        env:
          DATABASE_URL: postgresql://provence360:provence360@localhost:5432/provence360_test
          DATABASE_URL_APP: postgresql://provence360_app:provence360_app@localhost:5432/provence360_test
          DATABASE_URL_RESOLVER: postgresql://provence360_resolver:provence360_resolver@localhost:5432/provence360_test
          DATABASE_URL_AUTH: postgresql://provence360_auth:provence360_auth@localhost:5432/provence360_test
          NODE_ENV: test
        run: pnpm test

      - name: Build
        # `next build` (Next.js 16 / Turbopack) always runs as a production
        # build, but is only internally consistent if the environment says
        # so: with NODE_ENV explicitly set to "development" (the job-level
        # default above, which every other step is fine inheriting), the
        # special built-in `/_global-error` page's static prerender crashes
        # with `TypeError: Cannot read properties of null (reading
        # 'useContext')` — a real Next.js/React inconsistency between a
        # dev-flavored module graph and the production/static-export render
        # path, reproduced locally by toggling only this variable with every
        # other condition held identical to CI. Same per-step override
        # pattern the "Unit & integration tests" step above already uses for
        # its own different NODE_ENV need.
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Prepare dev database for e2e (migrate, roles, seed, publish)
        run: |
          pnpm db:migrate
          pnpm db:setup-roles
          pnpm db:seed
          pnpm db:publish-seed

      - name: Install Playwright browsers
        run: pnpm --filter @provence360/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # v1.0 — brief §13/§28: a real build-validation gate for the three
  # per-app Dockerfiles (see docs/DEPLOYMENT.md, "Containerization"). No
  # push, no registry, no credentials — this only proves each image still
  # builds, catching exactly the class of break the v1.0 audit found in
  # apps/worker's own build/start pipeline (see ADR 0023, Decision 2)
  # before it ever reaches a real deployment attempt.
  #
  # v1.0.1 — brief SUJET A: a passing build alone was flagged as
  # insufficient proof — this job now also actually STARTS each built
  # image and checks its real runtime behavior, on this runner's own
  # unrestricted Docker daemon (the sandbox this repo's own development
  # session runs in cannot pull base images at all — its egress policy
  # blocks the registry CDN — so this GitHub-hosted runner is the only
  # place in this project's whole toolchain that can genuinely prove
  # "docker run" works, not just "docker build"). See this release's final
  # report, DOCKER RUNTIME VALIDATION and WORKER CONTAINER LIFECYCLE, for
  # what these steps found.
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin, worker]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provence360
          POSTGRES_PASSWORD: provence360
          POSTGRES_DB: provence360_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provence360 -d provence360_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: provence360-${{ matrix.app }}:ci

      - name: Confirm the image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id provence360-${{ matrix.app }}:ci -u)"
          echo "Container runs as uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "::error::provence360-${{ matrix.app }}:ci runs as root (uid 0)"
            exit 1
          fi

      # web/admin: real container start, real HTTP health checks (liveness
      # never touches the database; readiness genuinely queries Postgres —
      # the `postgres` service above, via `--network host` so the
      # container reaches the runner's own `localhost:5432`), then a
      # clean `docker stop` (SIGTERM, same as an orchestrator would send).
      # `DATABASE_URL`/`DATABASE_URL_APP`/`DATABASE_URL_AUTH` only need to
      # be *shape-valid* — the app's own startup validation
      # (loadWebEnv/loadAdminEnv) requires them, but neither health route
      # dereferences them (only DATABASE_URL_RESOLVER does, for
      # readiness — see packages/database/src/health.ts) — so only that
      # one points at a role that can genuinely run `select 1`.
      - name: Start container and check health endpoints
        if: matrix.app == 'web' || matrix.app == 'admin'
        run: |
          docker run -d --name runtime-smoke --network host \
            -e NODE_ENV=production \
            -e MEDIA_ALLOW_MEMORY_IN_PRODUCTION=true \
            -e ROOT_DOMAIN=provence360.app \
            -e DATABASE_URL=postgresql://unused:unused@localhost:5432/provence360_dev \
            -e DATABASE_URL_APP=postgresql://unused:unused@localhost:5432/provence360_dev \
            -e DATABASE_URL_AUTH=postgresql://unused:unused@localhost:5432/provence360_dev \
            -e DATABASE_URL_RESOLVER=postgresql://provence360:provence360@localhost:5432/provence360_dev \
            provence360-${{ matrix.app }}:ci

          echo "Waiting for the container to answer on :3000 ..."
          live_ok=false
          for i in $(seq 1 30); do
            running="$(docker inspect --format='{{.State.Running}}' runtime-smoke 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "::error::container exited early, before ever answering /health/live"
              break
            fi
            if curl -sf http://localhost:3000/health/live > /tmp/live.json 2>/tmp/live.err; then
              live_ok=true
              break
            fi
            sleep 1
          done
          if [ "$live_ok" != "true" ]; then
            echo "::error::GET /health/live never succeeded within 30s"
            echo "--- container state ---"
            docker inspect --format='Running={{.State.Running}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' runtime-smoke || true
            echo "--- container logs ---"
            docker logs runtime-smoke || true
            docker rm -f runtime-smoke || true
            exit 1
          fi
          echo "GET /health/live -> $(cat /tmp/live.json)"
          grep -q '"status":"ok"' /tmp/live.json || {
            echo "::error::unexpected /health/live body"
            docker logs runtime-smoke
            docker rm -f runtime-smoke || true
            exit 1
          }

          curl -sf http://localhost:3000/health/ready > /tmp/ready.json || {
            echo "::error::GET /health/ready failed"
            docker logs runtime-smoke
            docker rm -f runtime-smoke || true
            exit 1
          }
          echo "GET /health/ready -> $(cat /tmp/ready.json)"
          grep -q '"status":"ok"' /tmp/ready.json || {
            echo "::error::unexpected /health/ready body"
            docker logs runtime-smoke
            docker rm -f runtime-smoke || true
            exit 1
          }

          docker logs runtime-smoke
          docker stop runtime-smoke
          exit_code="$(docker inspect --format='{{.State.ExitCode}}' runtime-smoke)"
          echo "Exit code after docker stop: $exit_code"
          docker rm runtime-smoke

      # worker: today's real minimal env (see
      # packages/validation/src/env.ts's workerEnvSchema — SUJET D) —
      # confirms the startup event fires, then a real SIGTERM (via `docker
      # stop`, exactly what an orchestrator sends) produces a clean,
      # logged shutdown and exit 0 — not a timeout-forced SIGKILL.
      - name: Start worker container, verify startup event, send SIGTERM, verify clean exit
        if: matrix.app == 'worker'
        run: |
          docker run -d --name runtime-smoke -e NODE_ENV=production provence360-worker:ci

          echo "Waiting for worker.started ..."
          for i in $(seq 1 30); do
            if docker logs runtime-smoke 2>&1 | grep -q worker.started; then break; fi
            running="$(docker inspect --format='{{.State.Running}}' runtime-smoke 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "::error::container exited early, before ever logging worker.started"
              break
            fi
            sleep 1
          done
          echo "--- container state ---"
          docker inspect --format='Running={{.State.Running}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}' runtime-smoke || true
          echo "--- container logs ---"
          docker logs runtime-smoke
          docker logs runtime-smoke | grep -q worker.started || {
            echo "::error::worker.started was never logged"
            docker rm -f runtime-smoke || true
            exit 1
          }

          docker stop --time 10 runtime-smoke
          exit_code="$(docker inspect --format='{{.State.ExitCode}}' runtime-smoke)"
          echo "Exit code after docker stop (SIGTERM): $exit_code"
          docker logs runtime-smoke
          docker logs runtime-smoke | grep -q worker.shutdown || {
            echo "::error::worker.shutdown was never logged — SIGTERM did not produce a clean shutdown"
            docker rm -f runtime-smoke || true
            exit 1
          }
          if [ "$exit_code" != "0" ]; then
            echo "::error::worker container exited $exit_code, expected 0"
            docker rm -f runtime-smoke || true
            exit 1
          fi
          docker rm runtime-smoke
